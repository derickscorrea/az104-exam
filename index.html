<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ-104 · Practice Exam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #07090F;
      --surface:     #0D1220;
      --surface-2:   #141929;
      --surface-3:   #1C2438;
      --border:      rgba(255,255,255,0.07);
      --border-md:   rgba(255,255,255,0.13);
      --primary:     #0078D4;
      --primary-h:   #1A8ADE;
      --primary-dim: rgba(0,120,212,0.15);
      --primary-lt:  #5BB3F5;
      --green:       #22C55E;
      --green-dim:   rgba(34,197,94,0.12);
      --red:         #EF4444;
      --red-dim:     rgba(239,68,68,0.12);
      --amber:       #F59E0B;
      --amber-dim:   rgba(245,158,11,0.1);
      --purple:      #A78BFA;
      --purple-dim:  rgba(167,139,250,0.1);
      --t1: #EEF2FF;
      --t2: #8B9DC3;
      --t3: #4A5878;
      --r: 10px;
      --r-lg: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    #header {
      background: rgba(7,9,15,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 200;
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .logo-mark {
      width: 30px; height: 30px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 16px; height: 16px; fill: white; }
    .logo-name { font-size: 14px; font-weight: 800; letter-spacing: -0.5px; color: var(--t1); }
    .logo-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: var(--primary-lt);
      background: var(--primary-dim);
      padding: 2px 8px; border-radius: 20px;
    }

    #nav {
      display: flex;
      gap: 2px;
      margin-left: auto;
    }
    .nav-btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--t2);
      transition: all .15s;
      font-family: inherit;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-btn:hover { color: var(--t1); background: rgba(255,255,255,0.05); }
    .nav-btn.active { color: var(--primary-lt); background: var(--primary-dim); }
    .nav-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      display: none;
    }
    .nav-btn.has-data .nav-dot { display: block; }

    /* ── Layout ── */
    #main {
      max-width: 740px;
      margin: 0 auto;
      padding: 36px 24px 100px;
    }
    .fade-up { animation: fadeUp .22s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 22px 26px;
    }
    .card-sm {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 18px;
    }

    /* ── Section label ── */
    .sec-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--t3);
      margin-bottom: 10px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 20px;
      border-radius: var(--r);
      font-size: 13px; font-weight: 700;
      cursor: pointer; border: none;
      transition: all .15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: var(--t2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--t1); background: rgba(255,255,255,0.08); border-color: var(--border-md); }
    .btn-danger {
      background: var(--red-dim);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.2);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* ── Toggle options ── */
    .toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .toggle-opt {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--t2);
      transition: all .15s;
      font-family: inherit;
    }
    .toggle-opt:hover { color: var(--t1); border-color: var(--border-md); }
    .toggle-opt.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary-lt); }

    /* ── Input ── */
    .inp {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 11px 14px;
      font-size: 14px;
      color: var(--t1);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      outline: none;
      transition: border-color .15s;
    }
    .inp:focus { border-color: var(--primary); }
    .inp::placeholder { color: var(--t3); }

    /* ── Domain cards ── */
    .domain-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 8px;
    }
    .domain-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
      user-select: none;
    }
    .domain-card:hover { border-color: var(--border-md); background: var(--surface-3); }
    .domain-card.selected { border-color: var(--primary); background: var(--primary-dim); }
    .domain-card.selected::after {
      content: '&#x2713;';
      position: absolute; top: 10px; right: 12px;
      width: 18px; height: 18px;
      background: var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: white;
    }
    .d-icon { font-size: 22px; margin-bottom: 8px; line-height: 1; }
    .d-name { font-size: 12px; font-weight: 700; color: var(--t1); margin-bottom: 3px; line-height: 1.3; }
    .d-pct { font-size: 11px; color: var(--t3); }

    /* ── Switch ── */
    .switch { position: relative; display: inline-block; width: 42px; height: 23px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface-3);
      border: 1px solid var(--border-md);
      border-radius: 23px;
      transition: .2s;
    }
    .slider::before {
      position: absolute; content: '';
      height: 17px; width: 17px;
      left: 2px; bottom: 2px;
      background: var(--t3); border-radius: 50%;
      transition: .2s;
    }
    input:checked + .slider { background: var(--primary-dim); border-color: var(--primary); }
    input:checked + .slider::before { transform: translateX(19px); background: var(--primary-lt); }

    /* ── Notice / Error ── */
    .notice {
      border: 1px solid rgba(245,158,11,0.3);
      background: var(--amber-dim);
      border-radius: var(--r);
      padding: 12px 16px;
      font-size: 13px; color: var(--amber);
      line-height: 1.6;
    }
    .notice a { color: var(--amber); }
    .err-box {
      border: 1px solid rgba(239,68,68,0.3);
      background: var(--red-dim);
      border-radius: var(--r);
      padding: 12px 16px;
      font-size: 13px; color: var(--red);
      line-height: 1.6;
    }

    /* ── Progress bar ── */
    .prog-wrap { height: 3px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width .4s ease; }

    /* ── Quiz option ── */
    .option {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all .15s;
      background: var(--surface-2);
      font-size: 14px; line-height: 1.55;
      color: var(--t1);
      user-select: none;
    }
    .option:hover:not(.locked) { border-color: var(--primary); background: var(--primary-dim); }
    .option.locked { cursor: default; }
    .option.sel-ok  { border-color: var(--green);   background: var(--green-dim); }
    .option.sel-bad { border-color: var(--red);     background: var(--red-dim); }
    .option.rev-ok  { border-color: var(--green);   background: var(--green-dim); }
    .opt-key {
      width: 26px; height: 26px; border-radius: 7px;
      border: 1px solid var(--border-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
      color: var(--t3);
      font-family: 'JetBrains Mono', monospace;
      transition: all .15s;
    }
    .sel-ok  .opt-key { background: var(--green); border-color: var(--green); color: #fff; }
    .sel-bad .opt-key { background: var(--red);   border-color: var(--red);   color: #fff; }
    .rev-ok  .opt-key { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── Explanation ── */
    .explanation {
      border-left: 3px solid var(--primary);
      padding: 13px 17px;
      background: rgba(0,120,212,0.07);
      border-radius: 0 9px 9px 0;
      font-size: 13px; line-height: 1.65;
      color: var(--t2);
    }
    .explanation strong { color: var(--t1); font-weight: 700; }
    .explanation .ref-link { display: block; margin-top: 6px; font-size: 11px; color: var(--t3); }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .b-blue   { background: var(--primary-dim); color: var(--primary-lt); }
    .b-green  { background: var(--green-dim);   color: var(--green); }
    .b-red    { background: var(--red-dim);      color: var(--red); }
    .b-amber  { background: var(--amber-dim);    color: var(--amber); }
    .b-purple { background: var(--purple-dim);   color: var(--purple); }
    .b-gray   { background: rgba(255,255,255,0.05); color: var(--t2); }

    /* ── Stats grid ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px;
      text-align: center;
    }
    .stat-num {
      font-size: 28px; font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1; margin-bottom: 5px;
    }
    .stat-lbl { font-size: 10px; color: var(--t3); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

    /* ── Bar chart ── */
    .bar-wrap { display: flex; flex-direction: column; gap: 12px; }
    .bar-row { display: flex; align-items: center; gap: 14px; }
    .bar-label { font-size: 12px; color: var(--t2); width: 180px; flex-shrink: 0; font-weight: 500; }
    .bar-track { flex: 1; height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .7s ease; }
    .bar-pct { font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; width: 38px; text-align: right; }

    /* ── Mini spark ── */
    .spark-wrap { display: flex; align-items: flex-end; gap: 5px; height: 70px; }
    .spark-bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 6px; transition: opacity .3s; }
    .spark-bar:hover { opacity: 1 !important; }

    /* ── History item ── */
    .h-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 13px;
    }
    .h-score-box {
      width: 54px; height: 54px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .h-score-num {
      font-size: 16px; font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Timer circle ── */
    .timer-wrap { position: relative; width: 52px; height: 52px; }
    .timer-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Flag button ── */
    .flag-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--t3);
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .flag-btn:hover { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
    .flag-btn.flagged { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }

    /* ── Spinner ── */
    .spinner {
      width: 34px; height: 34px;
      border: 2px solid rgba(0,120,212,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 72px 24px;
    }
    .empty-icon { font-size: 44px; margin-bottom: 14px; }
    .empty-text { font-size: 14px; color: var(--t2); line-height: 1.7; }

    /* ── Quiz full-screen override ── */
    body.in-quiz { overflow-x: hidden; }
    #quiz-screen {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    #quiz-topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(7,9,15,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }
    #quiz-body {
      flex: 1;
      max-width: 740px; width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* ── Utility ── */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .gap-5 { gap: 20px; }
    .mb-1 { margin-bottom: 6px; }
    .mb-2 { margin-bottom: 12px; }
    .mb-3 { margin-bottom: 18px; }
    .mb-4 { margin-bottom: 26px; }
    .mt-1 { margin-top: 6px; }
    .mt-2 { margin-top: 12px; }
    .mt-3 { margin-top: 18px; }
    .w-full { width: 100%; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-2 { color: var(--t2); }
    .text-3 { color: var(--t3); }
    .fw-700 { font-weight: 700; }
    .fw-600 { font-weight: 600; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .domain-grid { grid-template-columns: 1fr 1fr; }
      .bar-label { width: 110px; font-size: 11px; }
      #main { padding: 20px 16px 80px; }
      #quiz-body { padding: 20px 16px 40px; }
    }
  
    /* == Multi-select & Drag-drop question types == */
    .multi-option {
      display:flex; align-items:flex-start; gap:12px;
      padding:13px 16px; border-radius:var(--r);
      border:1px solid var(--border); cursor:pointer;
      background:var(--surface-2); font-size:14px; line-height:1.55;
      color:var(--t1); user-select:none; transition:all .15s;
    }
    .multi-option:hover:not(.locked) { border-color:var(--primary); background:var(--primary-dim); }
    .multi-option.checked { border-color:var(--primary); background:var(--primary-dim); }
    .multi-option.checked .opt-key { background:var(--primary); border-color:var(--primary); color:#fff; }
    .multi-option.locked { cursor:default; }
    .multi-option.reveal-correct { border-color:var(--green); background:var(--green-dim); }
    .multi-option.reveal-correct .opt-key { background:var(--green); border-color:var(--green); color:#fff; }
    .multi-option.reveal-wrong { border-color:var(--red); background:var(--red-dim); }
    .multi-option.reveal-wrong .opt-key { background:var(--red); border-color:var(--red); color:#fff; }

    .multi-counter {
      font-size:12px; color:var(--t2); font-weight:600;
      padding:5px 12px; background:var(--surface-3);
      border:1px solid var(--border); border-radius:20px;
    }
    .multi-counter.ready { border-color:var(--primary); color:var(--primary-lt); background:var(--primary-dim); }

    .dnd-container { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
    @media(max-width:600px){ .dnd-container { grid-template-columns:1fr; } }

    .dnd-panel {
      background:var(--surface-2); border:1px solid var(--border);
      border-radius:var(--r); padding:12px; min-height:120px;
    }
    .dnd-panel-title {
      font-size:10px; font-weight:700; letter-spacing:1px;
      text-transform:uppercase; color:var(--t3); margin-bottom:10px;
    }
    .dnd-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 13px; border-radius:8px;
      border:1px solid var(--border); background:var(--surface);
      font-size:13px; line-height:1.5; color:var(--t1);
      cursor:pointer; user-select:none; transition:all .15s;
      margin-bottom:7px;
    }
    .dnd-item:last-child { margin-bottom:0; }
    .dnd-item:hover:not(.locked) { border-color:var(--primary); background:var(--primary-dim); }
    .dnd-item .drag-handle { color:var(--t3); font-size:12px; flex-shrink:0; }
    .dnd-item.locked { cursor:default; }
    .dnd-item.correct { border-color:var(--green); background:var(--green-dim); }
    .dnd-item.incorrect { border-color:var(--red); background:var(--red-dim); }

    .dnd-answer-panel {
      background:var(--primary-dim); border:1px dashed var(--primary);
      border-radius:var(--r); padding:12px; min-height:120px;
    }
    .dnd-answer-panel.locked { background:var(--surface-2); border-style:solid; border-color:var(--border); }
    .dnd-empty {
      color:var(--t3); font-size:12px; text-align:center;
      padding:20px; font-style:italic;
    }
    .dnd-slots-info {
      font-size:11px; color:var(--primary-lt); font-weight:600;
      margin-bottom:8px;
    }



    /* Memory aid box */
    .memory-aid {
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; color: var(--purple);
      line-height: 1.65;
    }
    /* Print styles */
    @media print {
      #header, .btn, .flag-btn, #nav { display:none !important; }
      body { background: white !important; color: black !important; }
    }

    /* ======================================================
       LABS SECTION
       ====================================================== */
    .lab-domain-section { margin-bottom: 10px; }

    .lab-domain-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px; background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); cursor:pointer; user-select:none;
      transition:border-color .15s;
    }
    .lab-domain-header:hover { border-color:var(--border-md); }
    .lab-domain-header.open { border-radius:var(--r-lg) var(--r-lg) 0 0; border-bottom-color:transparent; }
    .lab-domain-left { display:flex; align-items:center; gap:12px; }
    .lab-domain-chevron { font-size:12px; color:var(--t3); transition:transform .2s; }
    .lab-domain-header.open .lab-domain-chevron { transform:rotate(180deg); }
    .lab-domain-name { font-size:15px; font-weight:700; }

function isAnswered(i) {
  var q = S.quiz.questions[i]; var a = S.quiz.answers[i];
  if (!q) return false;
  var type = q.type || 'single';
  if (type === 'single')    return a !== undefined && a !== null;
  if (type === 'multi')     return Array.isArray(a) && a.length === (q.selectCount || 2);
  if (type === 'drag_drop') return Array.isArray(a) && a.length === (q.selectCount || 3);
  return false;
}
function isCorrect(i) {
  var q = S.quiz.questions[i]; var a = S.quiz.answers[i];
  if (!q || a === undefined || a === null) return false;
  var type = q.type || 'single';
  if (type === 'single') return a === q.correct;
  if (type === 'multi' || type === 'drag_drop') {
    if (!Array.isArray(a) || !Array.isArray(q.correct)) return false;
    if (a.length !== q.correct.length) return false;
    var sa = a.slice().sort(function(x,y){return x-y;});
    var sc = q.correct.slice().sort(function(x,y){return x-y;});
    for (var j=0;j<sa.length;j++){if(sa[j]!==sc[j])return false;}
    return true;
  }
  return false;
}

function go(screen) { S.screen = screen; S.error = null; render(); }

  if (S.screen === 'quiz') { if (!confirm('Quit? Session will be lost.')) return; killTimer(); }
  go('home');
}
function openLab(labId) { S.currentLabId = labId; S.screen = 'lab_detail'; render(); }

function render() {
  var inQuiz = S.screen === 'quiz';
  document.getElementById('header').style.display = inQuiz ? 'none' : '';
  document.getElementById('main').style.display   = inQuiz ? 'none' : '';
  document.body.classList.toggle('in-quiz', inQuiz);
  var oldQuiz = document.getElementById('quiz-screen');
  if (oldQuiz) oldQuiz.remove();

  if (inQuiz) {
    var qs = document.createElement('div');
    qs.id = 'quiz-screen';
    qs.innerHTML = renderQuiz();
    document.body.appendChild(qs);
    attachQuizEvents();
    return;
  }

  var totalDone = S.labs.completed.length;
  document.getElementById('nav').innerHTML = [
    {id:'home',       label:'Home',       icon:'&#127968;'},
    {id:'labs',       label:'Labs',       icon:'&#129514;', badge: totalDone + '/' + LAB_LIST.length, dot: totalDone > 0},
    {id:'history',    label:'History',    icon:'&#128203;', dot: S.history.length > 0},
    {id:'analytics',  label:'Analytics',  icon:'&#128200;', dot: S.history.length > 0},
    {id:'cheatsheet', label:'Cheat Sheet', icon:'&#128221;'},
  ].map(function(n) {
    var badgeHtml = n.badge ? ' <span style="font-size:10px;background:var(--green-dim);color:var(--green);padding:1px 7px;border-radius:10px;">' + n.badge + '</span>' : '';
    return '<button class="nav-btn ' + (S.screen===n.id||(S.screen==='lab_detail'&&n.id==='labs')?'active':'') + ' ' + (n.dot?'has-data':'') + '" onclick="go(\'' + n.id + '\')">' +
      '<span class="nav-dot"></span>' + n.icon + ' ' + n.label + badgeHtml + '</button>';
  }).join('');

  var map = {
    home:renderHome, loading:renderLoading,
    labs:renderLabs, lab_detail:renderLabDetail,
    results:renderResults, review:renderReview,
    history:renderHistory, analytics:renderAnalytics,
    cheatsheet:renderCheatSheet
  };
  document.getElementById('main').innerHTML = '<div class="fade-up">' + ((map[S.screen]||renderHome)()) + '</div>';
  attachMainEvents();
}

// SHARED HELPERS

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function diffBadge(d) {
  var map = {easy:'b-green', medium:'b-amber', hard:'b-red'};
  return '<span class="badge ' + (map[d]||'b-gray') + '" style="font-size:10px;">' + escHtml(d) + '</span>';
}


// ============================================================
// DIFFICULTY CALIBRATION
// ============================================================
function getDifficultyRec() {
  var h = S.history;
  if (h.length < 2) return null;
  var recent = h.slice(-3);
  var avg = Math.round(recent.reduce(function(a,b){return a+b.score;},0) / recent.length);
  var cur = S.settings.difficulty;
  if (avg >= 80 && cur !== 'hard')   return {suggest:'hard',  avg:avg, msg:'You averaged ' + avg + '% in your last sessions. Ready for Hard?'};
  if (avg < 55  && cur !== 'easy')   return {suggest:'easy',  avg:avg, msg:'You averaged ' + avg + '% recently. Try Easy to build confidence.'};
  if (avg >= 65 && avg < 80 && cur === 'easy') return {suggest:'medium', avg:avg, msg:'You averaged ' + avg + '% on Easy. Ready to step up to Medium?'};
  return null;
}

// ============================================================
// WEAK AREA DRILL
// ============================================================
function startWeakDrill() {
  var domPerf = {};
  DOMAINS.forEach(function(d){ domPerf[d.id]={correct:0,total:0}; });
  S.history.forEach(function(s){
    if(!s.domainBreakdown)return;
    Object.keys(s.domainBreakdown).forEach(function(id){
      var stat=s.domainBreakdown[id];
      if(domPerf[id]){domPerf[id].correct+=stat.correct;domPerf[id].total+=stat.total;}
    });
  });
  var scored=Object.keys(domPerf).filter(function(id){return domPerf[id].total>0;}).map(function(id){
    return {id:id,pct:Math.round(domPerf[id].correct/domPerf[id].total*100)};
  }).sort(function(a,b){return a.pct-b.pct;});
  if(!scored.length){S.error='No history yet. Complete some sessions first.';render();return;}
  var weak=scored[0];
  S.settings.domains=[weak.id];
  S.settings.count=10;
  saveSettings();
  startQuiz();
}

  return '<div class="lab-row' + (done?' completed':'') + '" onclick="openLab(\'' + lab.id + '\')">' +
    '<div class="lab-icon' + (done?' completed':'') + '">' + (done?'&#9989;':dom.icon) + '</div>' +

function renderParsedLab(p) {
  var html = '';

  // Objective + scenario
  if (p.objective || p.scenario) {
    html += '<div class="lab-section-card">';
    if (p.objective) html += '<div class="lab-section-title">Objective</div><p style="font-size:14px;color:var(--t1);line-height:1.7;margin-bottom:' + (p.scenario?'12px':'0') + ';">' + escHtml(p.objective) + '</p>';
    if (p.scenario)  html += '<div class="lab-section-title" style="margin-top:' + (p.objective?'8px':'0') + '">Scenario</div><p style="font-size:13px;color:var(--t2);line-height:1.65;">' + escHtml(p.scenario) + '</p>';
    html += '</div>';
  }

  // Prerequisites
  if (p.prerequisites && p.prerequisites.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">Prerequisites</div>';
    p.prerequisites.forEach(function(item) {
      html += '<div class="checklist-item"><span class="warn-icon">&#9432;</span><span>' + escHtml(item) + '</span></div>';
    });
    html += '</div>';
  }

  // Steps
  if (p.steps && p.steps.length) {
    html += '<div class="sec-label" style="margin-bottom:10px;">Steps</div>';
    p.steps.forEach(function(step, idx) {
      var tabId = 'step-' + idx;
      var activeTab = (S.labs.activeTab[tabId] || 'portal');
      var hasCli     = !!(step.cli && step.cli.length > 2);
      var hasPortal  = !!(step.portal && step.portal.length);

      var tabHtml = '';
      if (hasPortal && hasCli) {
        tabHtml = '<div class="tab-group">' +
          '<button class="tab-btn' + (activeTab==='portal'?' active':'') + '" onclick="setLabTab(\'' + tabId + '\',\'portal\')" style="font-size:11px;padding:5px 12px;">&#128438; Portal</button>' +
          '<button class="tab-btn' + (activeTab==='cli'?' active':'') + '" onclick="setLabTab(\'' + tabId + '\',\'cli\')" style="font-size:11px;padding:5px 12px;">&#9112; Azure CLI</button>' +
        '</div>';
      }

      var portalHtml = '';
      if (hasPortal) {
        var steps = Array.isArray(step.portal) ? step.portal : [step.portal];
        portalHtml = '<div id="tab-' + tabId + '-portal"' + (hasCli&&activeTab!=='portal'?' style="display:none"':'') + '>';
        steps.forEach(function(s, si) {
          portalHtml += '<div class="portal-step">' +
            '<div class="portal-step-num">' + (si+1) + '</div>' +
            '<div>' + escHtml(String(s)) + '</div>' +
          '</div>';
        });
        portalHtml += '</div>';
      }

      var cliHtml = '';
      if (hasCli) {
        var cliId = 'cli-' + idx;
        cliHtml = '<div id="tab-' + tabId + '-cli"' + (hasPortal&&activeTab!=='cli'?' style="display:none"':'') + '>' +
          '<div class="code-block" style="position:relative;">' +
            '<button class="copy-btn" onclick="copyCode(\'' + cliId + '\')">Copy</button>' +
            '<span id="' + cliId + '">' + escHtml(step.cli) + '</span>' +
          '</div>' +
        '</div>';
      }

      var noteHtml = '';
      if (step.note) noteHtml = '<div class="note-box">&#9888;&#65039; ' + escHtml(step.note) + '</div>';

      html += '<div class="lab-step-card">' +
        '<div class="lab-step-header">' +
          '<div class="step-num">' + (idx+1) + '</div>' +
          '<div>' +
            '<div style="font-size:13px;font-weight:700;">' + escHtml(step.title) + '</div>' +
            (step.description ? '<div style="font-size:12px;color:var(--t2);margin-top:2px;">' + escHtml(step.description) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="lab-step-body">' + tabHtml + portalHtml + cliHtml + noteHtml + '</div>' +
      '</div>';
    });
  }

  // Validation
  if (p.validation && p.validation.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">&#10003; Validation checks</div>';
    p.validation.forEach(function(item) {
      html += '<div class="checklist-item"><span class="check-icon">&#10003;</span><span>' + escHtml(item) + '</span></div>';
    });
    html += '</div>';
  }

  // Cleanup
  if (p.cleanup && p.cleanup.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">&#128465; Cleanup</div>';
    p.cleanup.forEach(function(item) {
      html += '<div class="checklist-item"><span style="color:var(--red);">&#10005;</span><span>' + escHtml(item) + '</span></div>';
    });
    html += '</div>';
  }

  // Key concepts
  if (p.keyPoints && p.keyPoints.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">&#128161; Key concepts learned</div>';
    p.keyPoints.forEach(function(item) {
      html += '<div class="checklist-item"><span style="color:var(--primary-lt);">&#9679;</span><span>' + escHtml(item) + '</span></div>';
    });
    html += '</div>';
  }

  // MS Learn link
  html += '<div style="margin-top:8px;">' +
    '<a href="https://learn.microsoft.com/en-us/training/browse/?products=azure&roles=administrator" ' +
    'target="_blank" class="ms-learn-btn" style="text-decoration:none;">' +
    '&#9729;&#65039; Practice on Microsoft Learn free sandbox &rarr;</a>' +
  '</div>';

  return html;
}

function setLabTab(tabId, tab) {
  S.labs.activeTab[tabId] = tab;
  var portalEl = document.getElementById('tab-' + tabId + '-portal');
  var cliEl    = document.getElementById('tab-' + tabId + '-cli');
  if (portalEl) portalEl.style.display = tab==='portal'?'':'none';
  if (cliEl)    cliEl.style.display    = tab==='cli'   ?'':'none';
  document.querySelectorAll('[onclick*="setLabTab(\'' + tabId + '\'"]').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('onclick').indexOf("'" + tab + "'") > -1);
  });
}

function copyCode(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var text = el.textContent || el.innerText;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      var btn = el.parentElement.querySelector('.copy-btn');
      if (btn) { btn.textContent = 'Copied!'; setTimeout(function(){ btn.textContent = 'Copy'; }, 1500); }
    });
  }
}

function toggleBookmark(labId) {
  var idx = S.labs.bookmarked.indexOf(labId);
  if (idx > -1) S.labs.bookmarked.splice(idx,1); else S.labs.bookmarked.push(labId);
  saveLabs(); render();
}

function toggleDone(labId) {
  var idx = S.labs.completed.indexOf(labId);
  if (idx > -1) S.labs.completed.splice(idx,1); else S.labs.completed.push(labId);
  saveLabs(); render();
}

// GENERATE LAB (API CALL)
// ============================================================
function generateLab() {
  var lab = LAB_LIST.find(function(l){ return l.id === S.currentLabId; });
  if (!lab || !S.apiKey) return;

  var genBtn = document.getElementById('gen-lab-btn');
  if (genBtn) { genBtn.disabled = true; genBtn.innerHTML = 'Generating...'; }

  var dom = DOMAINS.find(function(d){return d.id===lab.domain;}) || {full:lab.domain};
  var apiPrompt =
    'You are a senior Microsoft Azure instructor writing a hands-on AZ-104 lab guide.\n' +
    'Lab: "' + lab.name + '" (Domain: ' + dom.full + ', Difficulty: ' + lab.difficulty + ', ' + lab.duration + ' min)\n\n' +
    'Return ONLY a raw JSON object (no markdown, no extra text) with this structure:\n' +
    '{"objective":"string","scenario":"string","prerequisites":["string"],' +
    '"steps":[{"title":"string","description":"string","portal":["string"],"cli":"string or null","note":"string or null"}],' +
    '"validation":["string"],"cleanup":["string"],"keyPoints":["string"]}\n\n' +
    'Rules:\n' +
    '- Exactly 5 steps (not more) to keep the response concise\n' +
    '- Step 1 must create a resource group named "rg-az104-lab"\n' +
    '- Portal array: 3-4 sub-steps each, enough detail to follow without screenshots\n' +
    '- CLI: real working az commands; use newline between multiple commands\n' +
    '- Use realistic resource names (rg-az104-lab, vm-web-01, vnet-prod-eastus, etc.)\n' +
    '- 2 validation checks, 1-2 cleanup steps (az group delete), 4 key concepts\n' +
    '- Keep each string under 200 characters to avoid truncation';

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': S.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 6000,
      messages: [{role:'user', content: apiPrompt}]
    })
  })
  .then(function(res) {
    if (!res.ok) return res.json().then(function(e){ throw new Error(e.error&&e.error.message?e.error.message:'API error '+res.status); });
    return res.json();
  })
  .then(function(data) {
    var raw = (data.content||[]).map(function(c){return c.text||'';}).join('');
    var fence = String.fromCharCode(96,96,96);
    var clean = raw.split(fence+'json').join('').split(fence).join('').trim();
    var parsed = JSON.parse(clean);
    if (!parsed.steps) throw new Error('Invalid lab guide format returned.');
    setLabContent(S.currentLabId, JSON.stringify(parsed));
    render();
  })
  .catch(function(e) {
    var genBtn2 = document.getElementById('gen-lab-btn');
    if (genBtn2) { genBtn2.disabled = false; genBtn2.innerHTML = '&#9889; Try again'; }
    var errDiv = document.createElement('div');
    errDiv.className = 'err-box';
    errDiv.style.marginTop = '12px';
    errDiv.innerHTML = 'Error: ' + escHtml(e.message || 'Unknown error');
    if (genBtn2 && genBtn2.parentNode) genBtn2.parentNode.appendChild(errDiv);
  });
}

function renderQuiz() {
  var q = S.quiz;
  var question = q.questions[q.current];
  if (!question) return '<div id="quiz-topbar"></div><div id="quiz-body"><div class="spinner"></div></div>';
  var type       = question.type || 'single';
  var answered   = isAnswered(q.current);
  var pct        = Math.round((q.current / q.questions.length) * 100);
  var isLast     = q.current === q.questions.length - 1;
  var domain     = DOMAINS.find(function(d){return d.id===question.domain;}) || {icon:'',name:question.domain};
  var isFlagged  = q.flagged.has(q.current);
  var timerOn    = S.settings.timer > 0;
  var tl         = q.timeLeft;
  var C          = 2 * Math.PI * 22;
  var dash       = timerOn ? C - (tl/S.settings.timer)*C : 0;
  var timerColor = tl<10?'var(--red)':tl<20?'var(--amber)':'var(--primary)';
  var typeBadge  = type==='multi'?'<span class="badge b-purple">&#9635; Select '+(question.selectCount||2)+'</span>':type==='drag_drop'?'<span class="badge b-amber">&#8645; Drag &amp; Drop</span>':'';
  var timerSvg   = timerOn ?
    '<div class="timer-wrap"><svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg)">' +
    '<circle cx="26" cy="26" r="22" fill="none" stroke="var(--surface-3)" stroke-width="3"/>' +
    '<circle id="timer-arc" cx="26" cy="26" r="22" fill="none" stroke="'+timerColor+'" stroke-width="3" stroke-dasharray="'+C+'" stroke-dashoffset="'+dash+'" stroke-linecap="round"/></svg>' +
    '<div class="timer-num" id="timer-num" style="color:'+(tl<10?'var(--red)':'var(--t1)')+'">'+Math.max(0,tl)+'</div></div>' : '';
  var bodyHtml = type==='single' ? renderSingleQ(question,answered) : type==='multi' ? renderMultiQ(question,answered) : renderDndQ(question,answered);
  var showFeedback = answered && !S.settings.examMode;
  var expHtml = '';
  if (showFeedback) {
    var ok2 = isCorrect(q.current);
    var ref = question.reference ? '<span class="ref-link">&#128218; Reference: '+escHtml(question.reference)+'</span>' : '';
    var memAid = question.memoryAid ? '<div class="memory-aid">&#129504; <strong>Memory aid:</strong> ' + escHtml(question.memoryAid) + '</div>' : '';
    expHtml = '<div class="explanation mb-4"><strong>'+(ok2?'&#9989; Correct!':'&#10060; Incorrect.')+'</strong> '+escHtml(question.explanation)+ref+'</div>' + memAid;
  }
  var actHtml = '';
  if (!answered) {
    if (type==='single') actHtml = '<span class="text-sm text-3">Pick an answer to continue</span>';
    else {
      var cur = S.quiz.answers[S.quiz.current]||[]; var need = question.selectCount||(type==='multi'?2:3);
      actHtml = '<button class="btn btn-primary" id="submit-q-btn"'+(cur.length!==need?' disabled':'')+'> Submit &rarr;</button>';
    }
  } else {
    actHtml = '<button class="btn btn-primary" onclick="nextQuestion()">'+(isLast?'&#127937; Finish exam':'Next &rarr;')+'</button>';
  }
  return '<div id="quiz-topbar">' +
    '<div class="flex items-center justify-between mb-2" style="gap:12px;">' +
      '<div class="flex items-center gap-2" style="flex-wrap:wrap;">' +
        '<button class="btn btn-ghost" onclick="quitQuiz()" style="padding:7px 14px;font-size:12px;">&larr; Quit</button>' +
        '<span class="badge b-blue">'+domain.icon+' '+escHtml(domain.name)+'</span>' + typeBadge +
        (S.settings.examMode?'<span class="badge b-amber">&#129514; Exam mode</span>':'') +
        (isFlagged?'<span class="badge b-amber">&#128681; Flagged</span>':'') +
      '</div>' +
      '<div class="flex items-center gap-3"><span class="text-sm font-mono text-2">'+(q.current+1)+' / '+q.questions.length+'</span>'+timerSvg+'</div>' +
    '</div>' +
    '<div class="prog-wrap"><div class="prog-fill" style="width:'+pct+'%"></div></div>' +
  '</div>' +
  '<div id="quiz-body">' +
    '<div class="card mb-4"><p style="font-size:16px;line-height:1.75;">'+escHtml(question.question)+'</p></div>' +
    bodyHtml + expHtml +
    '<div class="flex justify-between items-center">' +
      '<button class="flag-btn'+(isFlagged?' flagged':'')+'" onclick="toggleFlag()">'+(isFlagged?'&#128681; Flagged':'&#9873; Flag for review')+'</button>' +
      actHtml +
    '</div>' +
  '</div>';
}

function renderSingleQ(question, answered) {
  var userAns = S.quiz.answers[S.quiz.current];
  return '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">' +
    question.options.map(function(opt,i){
      var cls='option'; if(answered){cls+=' locked'; if(!S.settings.examMode){if(i===question.correct)cls+=' rev-ok'; if(i===userAns&&userAns!==question.correct)cls+=' sel-bad'; if(i===userAns&&userAns===question.correct)cls='option locked sel-ok';}else{if(i===userAns)cls+=' rev-ok';}}
      return '<div class="'+cls+'" data-opt="'+i+'" data-type="single"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div style="flex:1">'+escHtml(opt)+'</div></div>';
    }).join('')+'</div>';
}

function renderMultiQ(question, answered) {
  var sel=S.quiz.answers[S.quiz.current]||[]; var need=question.selectCount||2; var correct=question.correct||[];
  return '<div class="'+(sel.length===need?'multi-counter ready':'multi-counter')+'" style="margin-bottom:10px;">'+sel.length+' / '+need+' selected</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">' +
    question.options.map(function(opt,i){
      var isSel=sel.indexOf(i)>-1; var cls='multi-option';
      if(answered){cls+=' locked'; if(!S.settings.examMode){if(correct.indexOf(i)>-1)cls+=' reveal-correct'; else if(isSel)cls+=' reveal-wrong';}else{if(isSel)cls+=' checked';}}
      else{if(isSel)cls+=' checked';}
      return '<div class="'+cls+'" data-opt="'+i+'" data-type="multi"><div class="opt-key">'+(isSel?'&#9635;':'&#9634;')+'</div><div style="flex:1">'+escHtml(opt)+'</div></div>';
    }).join('')+'</div>';
}

function renderDndQ(question, answered) {
  var placed=S.quiz.answers[S.quiz.current]||[]; var need=question.selectCount||3; var correct=question.correct||[];
  var pool=[]; for(var k=0;k<question.options.length;k++){if(placed.indexOf(k)===-1)pool.push(k);}
  var pLocked=answered?' locked':'';
  var actItems=pool.length===0?'<div class="dnd-empty">All options placed</div>':pool.map(function(oi){return '<div class="dnd-item'+pLocked+'" data-dnd-pool="'+oi+'"><span class="drag-handle">&#8801;</span><span>'+escHtml(question.options[oi])+'</span></div>';}).join('');
  var ansItems='<div class="dnd-slots-info">'+placed.length+' / '+need+' placed</div>';
  if(placed.length===0){ansItems+='<div class="dnd-empty">Click items from Actions to place here</div>';}
  else{ansItems+=placed.map(function(oi){var cls='dnd-item';if(answered&&!S.settings.examMode){cls+=correct.indexOf(oi)>-1?' correct':' incorrect';}cls+=pLocked;return '<div class="'+cls+'" data-dnd-answer="'+oi+'">'+(answered?'':'<span class="drag-handle" style="color:var(--red);">&#10005;</span>')+'<span>'+escHtml(question.options[oi])+'</span></div>';}).join('');}
  var missed=''; if(answered&&!S.settings.examMode){var m=correct.filter(function(c){return placed.indexOf(c)===-1;});if(m.length){missed='<div style="margin-top:10px;"><div class="text-xs text-3" style="margin-bottom:6px;">Also correct:</div>'+m.map(function(oi){return '<div class="dnd-item correct locked" style="opacity:.8"><span>'+escHtml(question.options[oi])+'</span></div>';}).join('')+'</div>';}}
  return '<div class="dnd-container">' +
    '<div><div class="dnd-panel"><div class="dnd-panel-title">&#8645; Actions (click to place)</div>'+actItems+'</div></div>' +
    '<div><div class="dnd-answer-panel'+(answered?' locked':'')+'">' +
      '<div class="dnd-panel-title">Answer Area</div>'+ansItems+missed+
    '</div></div></div>';
}

// RESULTS SCREEN
// ============================================================
function renderResults() {
  var q=S.quiz; var correct=0;
  for(var ri=0;ri<q.questions.length;ri++){if(isCorrect(ri))correct++;}
  var total=q.questions.length; var score=Math.round((correct/total)*100); var passed=score>=PASS_PCT;
  var dur=(q.endTime&&q.startTime)?Math.round((q.endTime-q.startTime)/1000):0;
  var mins=Math.floor(dur/60); var secs=String(dur%60).padStart(2,'0');
  var flagged=q.flagged.size;
  var domainStats={};
  q.questions.forEach(function(qu,i){if(!domainStats[qu.domain])domainStats[qu.domain]={correct:0,total:0};domainStats[qu.domain].total++;if(isCorrect(i))domainStats[qu.domain].correct++;});
  var typeCounts={single:0,multi:0,drag_drop:0}; var typeCorrect={single:0,multi:0,drag_drop:0};
  q.questions.forEach(function(qu,i){var t=qu.type||'single';typeCounts[t]=(typeCounts[t]||0)+1;if(isCorrect(i))typeCorrect[t]=(typeCorrect[t]||0)+1;});
  var weakDomains=Object.keys(domainStats).filter(function(id){return Math.round(domainStats[id].correct/domainStats[id].total*100)<60;}).map(function(id){return (DOMAINS.find(function(d){return d.id===id;})||{name:id}).name;});
  var scoreColor=score>=80?'var(--green)':score>=PASS_PCT?'var(--primary-lt)':'var(--red)';
  var bars=Object.keys(domainStats).map(function(domId){var stat=domainStats[domId];var dom=DOMAINS.find(function(d){return d.id===domId;})||{icon:'',name:domId};var pct=Math.round((stat.correct/stat.total)*100);var col=pct>=80?'var(--green)':pct>=60?'var(--primary-lt)':'var(--red)';return '<div class="bar-row"><div class="bar-label">'+dom.icon+' '+escHtml(dom.name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div><div class="bar-pct" style="color:'+col+'">'+pct+'%</div></div>';}).join('');
  var typeLabels={single:'Single-answer',multi:'Multi-select',drag_drop:'Drag &amp; Drop'};
  var typeBoxes=Object.keys(typeCounts).filter(function(t){return typeCounts[t]>0;}).map(function(t){var cnt=typeCounts[t];var c=typeCorrect[t]||0;var pct=Math.round((c/cnt)*100);var col=pct>=80?'var(--green)':pct>=60?'var(--amber)':'var(--red)';return '<div class="stat-box"><div class="stat-num" style="font-size:18px;color:'+col+'">'+c+'/'+cnt+'</div><div class="stat-lbl">'+typeLabels[t]+'</div></div>';}).join('');
  var weakBox=weakDomains.length>0?'<div class="card-sm" style="border-color:rgba(245,158,11,0.25);background:var(--amber-dim);"><div class="text-sm fw-700" style="color:var(--amber);margin-bottom:4px;">&#128161; Study recommendations</div><div class="text-sm text-2">Focus on: <strong style="color:var(--t1)">'+escHtml(weakDomains.join(', '))+'</strong> &mdash; scored below 60%.</div></div>':'';
  var flagBox=flagged>0?'<div class="card-sm mb-3 flex items-center justify-between" style="gap:12px;"><span class="text-sm">&#128681; You flagged <strong>'+flagged+'</strong> question'+(flagged!==1?'s':'')+' for review.</span><button class="btn btn-ghost" onclick="go(\'review\')" style="font-size:12px;padding:6px 12px;flex-shrink:0;">Review &rarr;</button></div>':'';

  // Save history
  var domBreakdown={};
  q.questions.forEach(function(qu,i){if(!domBreakdown[qu.domain])domBreakdown[qu.domain]={correct:0,total:0};domBreakdown[qu.domain].total++;if(isCorrect(i))domBreakdown[qu.domain].correct++;});
  if(!S.quiz._saved){
    S.quiz._saved=true;
    S.history.push({date:new Date().toISOString(),score:score,correct:correct,total:total,passed:passed,domains:S.settings.domains.slice(),difficulty:S.settings.difficulty,examMode:S.settings.examMode,timer:S.settings.timer,duration:q.endTime-q.startTime,domainBreakdown:domBreakdown});
    if(S.history.length>MAX_HIST)S.history.shift();
    saveHistory();
  }

  return '<div class="flex justify-between items-center mb-4" style="flex-wrap:wrap;gap:10px;">' +
    '<h1 style="font-size:20px;font-weight:800;">Exam Results</h1>' +
    '<div class="flex gap-2" style="flex-wrap:wrap;">' +
      '<button class="btn btn-ghost" onclick="go(\'review\')" style="font-size:12px;padding:8px 14px;">Review answers</button>' +
      '<button class="btn btn-ghost" onclick="retryExam()" style="font-size:12px;padding:8px 14px;">&#128260; Retry</button>' +
      '<button class="btn btn-ghost" onclick="go(\'home\')" style="font-size:12px;padding:8px 14px;">&larr; New session</button>' +
    '</div></div>' +
    '<div class="card mb-3" style="text-align:center;padding:40px 24px;">' +
      '<div style="font-size:80px;font-weight:800;font-family:\'JetBrains Mono\',monospace;line-height:1;color:'+scoreColor+';">'+score+'%</div>' +
      '<div class="text-sm text-2" style="margin:10px 0 18px;">'+(passed?'&#127881; You passed! Well done.':'&#128218; Keep studying &mdash; aim for '+PASS_PCT+'%+')+'</div>' +
      '<span class="badge '+(passed?'b-green':'b-red')+'" style="font-size:13px;padding:6px 18px;">'+(passed?'&#10003; Passing score':'&#10005; Below passing score ('+PASS_PCT+'% required)')+'</span>' +
    '</div>' +
    '<div class="stats-row mb-3">' +
      '<div class="stat-box"><div class="stat-num" style="color:var(--green)">'+correct+'</div><div class="stat-lbl">Correct</div></div>' +
      '<div class="stat-box"><div class="stat-num" style="color:var(--red)">'+(total-correct)+'</div><div class="stat-lbl">Incorrect</div></div>' +
      '<div class="stat-box"><div class="stat-num">'+total+'</div><div class="stat-lbl">Total</div></div>' +
      '<div class="stat-box"><div class="stat-num text-2">'+mins+'m '+secs+'s</div><div class="stat-lbl">Time</div></div>' +
    '</div>' +
    (typeBoxes?'<div class="mb-3"><div class="sec-label">By question type</div><div class="stats-row">'+typeBoxes+'</div></div>':'') +
    flagBox +
    '<div class="card mb-3"><div class="sec-label">Domain Breakdown</div><div class="bar-wrap">'+bars+'</div></div>' +
    weakBox;
}

function renderReview() {
  var q=S.quiz;
  var items=q.questions.map(function(question,i){
    var ok=isCorrect(i); var flagged=q.flagged.has(i);
    var dom=DOMAINS.find(function(d){return d.id===question.domain;})||{icon:'',name:question.domain};
    var type=question.type||'single';

function killTimer(){if(S.quiz.timerInt){clearInterval(S.quiz.timerInt);S.quiz.timerInt=null;}}
function startTimer(){
  killTimer();if(!S.settings.timer)return;
  S.quiz.timeLeft=S.settings.timer;var C=2*Math.PI*22;
  S.quiz.timerInt=setInterval(function(){
    S.quiz.timeLeft=Math.max(0,S.quiz.timeLeft-1);var tl=S.quiz.timeLeft;
    var numEl=document.getElementById('timer-num');var arcEl=document.getElementById('timer-arc');
    if(numEl){numEl.textContent=tl;numEl.style.color=tl<10?'var(--red)':'var(--t1)';}
    if(arcEl){arcEl.setAttribute('stroke-dashoffset',C-(tl/S.settings.timer)*C);arcEl.setAttribute('stroke',tl<10?'var(--red)':tl<20?'var(--amber)':'var(--primary)');}
    if(tl<=0){killTimer();if(!isAnswered(S.quiz.current)){var type=(S.quiz.questions[S.quiz.current]||{}).type||'single';S.quiz.answers[S.quiz.current]=type==='single'?-1:[];render();}}
  },1000);
}

// ============================================================
// EXAM GENERATION
// ============================================================
function startQuiz(){
  if(!S.apiKey){S.error='Please enter your Anthropic API key first.';render();return;}
  if(!S.settings.domains.length){S.error='Please select at least one domain.';render();return;}
  S.screen='loading';S.error=null;
  S.quiz={questions:[],answers:[],flagged:new Set(),current:0,timeLeft:S.settings.timer,timerInt:null,startTime:Date.now(),endTime:null,_saved:false};
  render();
  var selDomains=DOMAINS.filter(function(d){return S.settings.domains.indexOf(d.id)>-1;});
  var domainNames=selDomains.map(function(d){return d.full;}).join(', ');
  var diffGuide={easy:'Questions should test definitions, basic concepts, and what each service does.',medium:'Use practical real-world scenarios. Require the user to choose between services or configurations.',hard:'Focus on troubleshooting broken setups, cost-optimisation, complex architectures, and CLI nuances.'};
  var n=S.settings.count; var nSingle=Math.round(n*0.50); var nMulti=Math.round(n*0.30); var nDd=n-nSingle-nMulti; var exD=selDomains[0].id;
  var skillsForDomains = selDomains.map(function(d){
    var skills = DOMAIN_SKILLS[d.id] || [];
    return d.name + ': ' + skills.slice(0,6).join('; ');
  }).join(' | ');
  var apiPrompt='You are a senior Microsoft Azure instructor writing AZ-104 exam practice questions aligned to the OFFICIAL Microsoft study guide (April 2026).\n'+
    'Generate exactly '+n+' questions: '+nSingle+' single-answer, '+nMulti+' multi-select, '+nDd+' drag-and-drop.\n'+
    'Domains: '+domainNames+'.\nDifficulty: '+S.settings.difficulty+' - '+(diffGuide[S.settings.difficulty]||diffGuide.medium)+'\n\n'+
    'TYPES:\n1. type:"single" - 4 options, correct is a number 0-3.\n2. type:"multi" - 5 options, selectCount correct (2 or 3), correct is an array. Say "Select TWO/THREE" in question.\n3. type:"drag_drop" - 5 options, selectCount correct (2 or 3), correct is array. Say "Select TWO/THREE that apply".\n\n'+
    'Rules: Plausible distractors. Explain why correct is right and key distractor wrong. Include reference topic. Spread across all domains.\n\n'+
    'Respond ONLY with raw JSON array:\n[{"type":"single","domain":"'+exD+'","question":"...","options":["A","B","C","D"],"correct":0,"explanation":"...","reference":"..."},'+
    '{"type":"multi","domain":"'+exD+'","question":"Select TWO...","selectCount":2,"options":["A","B","C","D","E"],"correct":[0,2],"explanation":"...","reference":"..."},'+
    '{"type":"drag_drop","domain":"'+exD+'","question":"Select THREE...","selectCount":3,"options":["A","B","C","D","E"],"correct":[0,1,3],"explanation":"...","reference":"..."}]';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-4-8',max_tokens:10000,messages:[{role:'user',content:apiPrompt}]})
  })
  .then(function(res){if(!res.ok)return res.json().then(function(e){throw new Error(e.error&&e.error.message?e.error.message:'API error '+res.status);});return res.json();})
  .then(function(data){
    var raw=(data.content||[]).map(function(c){return c.text||'';}).join('');
    var fence=String.fromCharCode(96,96,96);
    var clean=raw.split(fence+'json').join('').split(fence).join('').trim();
    var parsed=JSON.parse(clean);
    if(!Array.isArray(parsed)||!parsed.length)throw new Error('Unexpected response format.');
    // Fix 1: use correct.length as source of truth for selectCount
    // Fix 2: shuffle options while remapping correct indices so answers aren't always on top
    parsed = parsed.map(function(q){
      if((q.type==='multi'||q.type==='drag_drop')&&Array.isArray(q.correct)&&q.correct.length>0){
        q.selectCount=q.correct.length;
      }
      // Shuffle options for ALL question types and remap correct index/indices
      if(Array.isArray(q.options)&&q.options.length>1){
        // Build index map: newPos -> oldPos
        var indices=q.options.map(function(_,i){return i;});
        // Fisher-Yates shuffle
        for(var i=indices.length-1;i>0;i--){
          var j=Math.floor(Math.random()*(i+1));
          var tmp=indices[i];indices[i]=indices[j];indices[j]=tmp;
        }
        // Reorder options
        var newOptions=indices.map(function(oldIdx){return q.options[oldIdx];});
        // Build reverse map: oldIdx -> newIdx
        var oldToNew={};
        indices.forEach(function(oldIdx,newIdx){oldToNew[oldIdx]=newIdx;});
        // Remap correct
        if(typeof q.correct==='number'){
          q.correct=oldToNew[q.correct];
        } else if(Array.isArray(q.correct)){
          q.correct=q.correct.map(function(oldIdx){return oldToNew[oldIdx];});
        }
        q.options=newOptions;
      }
      return q;
    });
    S.quiz.questions=parsed;var qs=document.getElementById('quiz-screen');if(qs)qs.remove();
    S.screen='quiz';render();if(S.settings.timer>0)startTimer();
  })
  .catch(function(e){S.screen='home';S.error=e.message||'Failed to generate questions.';render();});
}


// ============================================================
// PRINT REPORT
// ============================================================
function printReport() {
  var q = S.quiz;
  var correct = 0;
  for (var ri=0;ri<q.questions.length;ri++){if(isCorrect(ri))correct++;}
  var total   = q.questions.length;
  var score   = Math.round((correct/total)*100);
  var passed  = score >= PASS_PCT;
  var dur     = (q.endTime&&q.startTime)?Math.round((q.endTime-q.startTime)/1000):0;
  var domainStats = {};
  q.questions.forEach(function(qu,i){if(!domainStats[qu.domain])domainStats[qu.domain]={correct:0,total:0};domainStats[qu.domain].total++;if(isCorrect(i))domainStats[qu.domain].correct++;});

  var barRows = Object.keys(domainStats).map(function(domId){
    var stat=domainStats[domId]; var dom=DOMAINS.find(function(d){return d.id===domId;})||{name:domId};
    var pct=Math.round((stat.correct/stat.total)*100);
    return '<tr><td style="padding:6px 10px;border-bottom:1px solid #eee;font-size:13px;">' + escHtml(dom.name) + '</td>' +
      '<td style="padding:6px 10px;border-bottom:1px solid #eee;"><div style="background:#eee;border-radius:4px;height:12px;width:200px;">' +
      '<div style="background:' + (pct>=70?'#0078D4':'#EF4444') + ';height:12px;border-radius:4px;width:' + pct + '%;"></div></div></td>' +
      '<td style="padding:6px 10px;border-bottom:1px solid #eee;font-size:13px;font-weight:700;color:' + (pct>=70?'#0078D4':'#EF4444') + ';">' + pct + '%</td></tr>';
  }).join('');

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AZ-104 Exam Report</title>' +
    '<style>body{font-family:system-ui,sans-serif;padding:40px;max-width:700px;margin:0 auto;color:#111;}' +
    'h1{font-size:22px;margin-bottom:4px;}' +
    '.score{font-size:72px;font-weight:800;color:' + (passed?'#0078D4':'#EF4444') + ';line-height:1;margin:16px 0 4px;}' +
    '.verdict{font-size:16px;font-weight:700;color:' + (passed?'#0078D4':'#EF4444') + ';margin-bottom:24px;}' +
    '.meta{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap;}' +
    '.meta-item{background:#f5f7fa;border-radius:8px;padding:12px 16px;min-width:100px;}' +
    '.meta-num{font-size:22px;font-weight:800;}' +
    '.meta-lbl{font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;}' +
    'table{width:100%;border-collapse:collapse;margin-top:8px;}' +
    'h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:24px 0 8px;}' +
    '.footer{margin-top:32px;font-size:11px;color:#999;border-top:1px solid #eee;padding-top:12px;}' +
    '@media print{body{padding:20px;}}' +
    '</style></head><body>' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;"><div>' +
    '<h1>AZ-104 Practice Exam Report</h1>' +
    '<div style="font-size:13px;color:#666;">' + new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}) + '</div>' +
    '</div><div style="text-align:right;font-size:12px;color:#999;">Microsoft Azure Administrator</div></div>' +
    '<div class="score">' + score + '%</div>' +
    '<div class="verdict">' + (passed?'PASS - Exceeds passing threshold (700/1000)':'FAIL - Below passing threshold (700/1000)') + '</div>' +
    '<div class="meta">' +
    '<div class="meta-item"><div class="meta-num">' + correct + '</div><div class="meta-lbl">Correct</div></div>' +
    '<div class="meta-item"><div class="meta-num">' + (total-correct) + '</div><div class="meta-lbl">Incorrect</div></div>' +
    '<div class="meta-item"><div class="meta-num">' + total + '</div><div class="meta-lbl">Questions</div></div>' +
    '<div class="meta-item"><div class="meta-num">' + Math.floor(dur/60) + 'm ' + String(dur%60).padStart(2,'0') + 's</div><div class="meta-lbl">Time taken</div></div>' +
    '<div class="meta-item"><div class="meta-num">' + escHtml(S.settings.difficulty) + '</div><div class="meta-lbl">Difficulty</div></div>' +
    '</div>' +
    '<h2>Domain Breakdown</h2>' +
    '<table>' + barRows + '</table>' +
    '<div class="footer">Generated by AZ-104 Practice Tool &middot; Based on Microsoft official study guide (April 2026) &middot; Passing score: 700/1000 (70%)</div>' +
    '</body></html>';

  var win = window.open('','_blank','width=800,height=700');
  if (win) { win.document.write(html); win.document.close(); win.focus(); setTimeout(function(){ win.print(); }, 400); }
}

// CHEAT SHEET SCREEN
// ============================================================
function renderCheatSheet() {
  var s = S.settings;

  var domainBtns = DOMAINS.map(function(d) {
    var hasCached = !!S.cheatsheets[d.id];
    var isActive  = s.cheatDomain === d.id;
    return '<button class="toggle-opt ' + (isActive?'active':'') + '" data-cs-domain="' + d.id + '" style="position:relative;">' +
      d.icon + ' ' + escHtml(d.name) +
      (hasCached?' <span style="font-size:9px;background:var(--green-dim);color:var(--green);padding:1px 5px;border-radius:8px;margin-left:4px;">saved</span>':'') +
    '</button>';
  }).join('');

  var activeDom = s.cheatDomain || null;
  var cached    = activeDom ? S.cheatsheets[activeDom] : null;
  var parsed    = null;
  if (cached) { try { parsed = JSON.parse(cached); } catch(e){ parsed = null; } }

  var bodyHtml = '';
  if (!activeDom) {
    bodyHtml = '<div class="empty"><div class="empty-icon">&#128221;</div>' +
      '<div class="empty-text">Select a domain above to generate a cheat sheet.<br>Each cheat sheet is saved locally so you only generate it once.</div></div>';
  } else if (!parsed) {
    bodyHtml = '<div class="generate-lab-card">' +
      '<div style="font-size:40px;margin-bottom:14px;">&#128221;</div>' +
      '<div style="font-size:16px;font-weight:700;margin-bottom:8px;">Generate Cheat Sheet</div>' +
      '<div class="text-sm text-2" style="max-width:420px;margin:0 auto 20px;">Claude will generate a quick-reference card for <strong>' +
      escHtml((DOMAINS.find(function(d){return d.id===activeDom;})||{name:activeDom}).name) +
      '</strong> covering all official exam skills, key CLI commands, mnemonics, and common gotchas.</div>' +
      (!S.apiKey ?
        '<div class="err-box" style="max-width:400px;margin:0 auto;">API key required. Set it on the Home screen.</div>' :
        '<button class="btn btn-primary" id="gen-cs-btn" style="font-size:14px;padding:12px 28px;">&#9889; Generate Cheat Sheet</button>'
      ) +
    '</div>';
  } else {
    bodyHtml = renderParsedCheatSheet(parsed, activeDom);
  }

  return '<div class="flex justify-between items-center mb-4" style="flex-wrap:wrap;gap:10px;">' +
    '<div><h1 style="font-size:20px;font-weight:800;margin-bottom:4px;">&#128221; Cheat Sheets</h1>' +
    '<div class="text-sm text-2">Quick-reference cards based on the official AZ-104 study guide (April 2026)</div></div>' +
    (parsed ? '<button class="btn btn-ghost" onclick="printCheatSheet(&#39;' + activeDom + '&#39;)" style="font-size:12px;padding:8px 14px;">&#128438; Print</button>' : '') +
    '</div>' +
    '<div class="card-sm mb-4"><div class="sec-label" style="margin-bottom:8px;">Select domain</div>' +
    '<div class="toggle-group" style="flex-wrap:wrap;">' + domainBtns + '</div></div>' +
    bodyHtml;
}

function renderParsedCheatSheet(p, domId) {
  var dom = DOMAINS.find(function(d){return d.id===domId;})||{name:domId,icon:''};
  var html = '<div class="card mb-3" style="border-color:rgba(0,120,212,0.3);background:rgba(0,120,212,0.05);">' +
    '<div style="font-size:11px;color:var(--t3);margin-bottom:6px;">OFFICIAL AZ-104 STUDY GUIDE &middot; ' + escHtml(dom.name.toUpperCase()) + '</div>' +
    '<div style="font-size:16px;font-weight:800;">' + dom.icon + ' ' + escHtml(p.title||dom.name) + ' &mdash; Quick Reference</div>' +
  '</div>';

  if (p.sections && p.sections.length) {
    p.sections.forEach(function(sec) {
      html += '<div class="lab-section-card">' +
        '<div class="lab-section-title">' + escHtml(sec.title) + '</div>' +
        '<table style="width:100%;border-collapse:collapse;">';
      (sec.rows||sec.items||[]).forEach(function(row) {
        html += '<tr>' +
          '<td class="font-mono" style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--primary-lt);white-space:nowrap;vertical-align:top;width:30%;">' + escHtml(row.term||row.key||'') + '</td>' +
          '<td style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--t2);vertical-align:top;">' + escHtml(row.def||row.definition||row.value||'') + '</td>' +
        '</tr>';
      });
      html += '</table></div>';
    });
  }

  if (p.commands && p.commands.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">&#9112; Key CLI Commands</div>';
    p.commands.forEach(function(cmd) {
      html += '<div style="margin-bottom:10px;">' +
        '<div style="font-size:11px;color:var(--t3);margin-bottom:4px;">' + escHtml(cmd.desc||cmd.description||'') + '</div>' +
        '<div class="code-block" style="font-size:11px;padding:8px 12px;">' + escHtml(cmd.cmd||cmd.command||'') + '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  if (p.mnemonics && p.mnemonics.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">&#129504; Mnemonics & Memory Aids</div>';
    p.mnemonics.forEach(function(m) {
      html += '<div class="memory-aid" style="margin-bottom:8px;">' + escHtml(m) + '</div>';
    });
    html += '</div>';
  }

  if (p.gotchas && p.gotchas.length) {
    html += '<div class="lab-section-card"><div class="lab-section-title">&#9888;&#65039; Common Gotchas &amp; Exam Traps</div>';
    p.gotchas.forEach(function(g) {
      html += '<div class="checklist-item"><span style="color:var(--amber);">&#9888;</span><span>' + escHtml(g) + '</span></div>';
    });
    html += '</div>';
  }

  return html;
}

function generateCheatSheet() {
  var domId = S.settings.cheatDomain;
  if (!domId || !S.apiKey) return;
  var dom = DOMAINS.find(function(d){return d.id===domId;})||{name:domId,full:domId};
  var skills = (DOMAIN_SKILLS[domId]||[]).join('; ');

  var btn = document.getElementById('gen-cs-btn');
  if (btn) { btn.disabled=true; btn.innerHTML='Generating...'; }

  var apiPrompt = 'You are a senior Microsoft Azure instructor writing a cheat sheet for AZ-104 candidates. Domain: ' + dom.full + '. Official exam skills to cover: ' + skills + '. Return ONLY a raw JSON object (no markdown) with this structure: {"title":"string","sections":[{"title":"string","rows":[{"term":"string","def":"string"}]}],"commands":[{"cmd":"string","desc":"string"}],"mnemonics":["string"],"gotchas":["string"]} Rules: 3-5 sections covering official skills (e.g. Key Services, Limits and Tiers, Comparison Tables). Each section: 4-8 rows of term/definition pairs, concise and exam-focused. 5-8 real az CLI commands that appear in the exam. 3-5 mnemonics or memorable analogies for hard-to-remember concepts. 4-6 gotchas: tricky exam traps, common misconceptions, or surprising behaviours. Keep all strings under 150 characters. Only include content mapping directly to the official study guide skills above.';
  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,messages:[{role:'user',content:apiPrompt}]})
  })
  .then(function(res){if(!res.ok)return res.json().then(function(e){throw new Error(e.error&&e.error.message?e.error.message:'API error '+res.status);});return res.json();})
  .then(function(data){
    var raw=(data.content||[]).map(function(c2){return c2.text||'';}).join('');
    var fence=String.fromCharCode(96,96,96);
    var clean=raw.split(fence+'json').join('').split(fence).join('').trim();
    var parsed=JSON.parse(clean);
    if(!parsed.sections)throw new Error('Invalid cheat sheet format.');
    S.cheatsheets[domId]=JSON.stringify(parsed);
    render();
  })
  .catch(function(e){
    var btn2=document.getElementById('gen-cs-btn');
    if(btn2){btn2.disabled=false;btn2.innerHTML='&#9889; Try again';}
    var errDiv=document.createElement('div');
    errDiv.className='err-box';errDiv.style.marginTop='12px';
    errDiv.innerHTML='Error: '+escHtml(e.message||'Unknown error');
    if(btn2&&btn2.parentNode)btn2.parentNode.appendChild(errDiv);
  });
}

function printCheatSheet(domId) {
  var cached = S.cheatsheets[domId];
  if (!cached) return;
  var p; try{p=JSON.parse(cached);}catch(e){return;}
  var dom = DOMAINS.find(function(d){return d.id===domId;})||{name:domId,icon:''};

  var sectionsHtml = '';
  if (p.sections) {
    p.sections.forEach(function(sec) {
      sectionsHtml += '<h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:18px 0 6px;">' + sec.title + '</h2>' +
        '<table style="width:100%;border-collapse:collapse;margin-bottom:8px;">';
      (sec.rows||sec.items||[]).forEach(function(row){
        sectionsHtml += '<tr><td style="padding:5px 8px;border:1px solid #ddd;font-family:monospace;font-size:12px;font-weight:700;color:#0078D4;width:28%;vertical-align:top;">' + (row.term||'') + '</td><td style="padding:5px 8px;border:1px solid #ddd;font-size:12px;vertical-align:top;">' + (row.def||row.definition||'') + '</td></tr>';
      });
      sectionsHtml += '</table>';
    });
  }
  if (p.mnemonics && p.mnemonics.length) {
    sectionsHtml += '<h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:18px 0 6px;">Memory Aids</h2>';
    p.mnemonics.forEach(function(m){sectionsHtml += '<div style="background:#f0f4ff;border-left:3px solid #0078D4;padding:6px 10px;margin-bottom:6px;font-size:12px;">' + m + '</div>';});
  }
  if (p.gotchas && p.gotchas.length) {
    sectionsHtml += '<h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:18px 0 6px;">Exam Gotchas</h2>';
    p.gotchas.forEach(function(g){sectionsHtml += '<div style="background:#fff8e6;border-left:3px solid #F59E0B;padding:6px 10px;margin-bottom:6px;font-size:12px;">' + g + '</div>';});
  }
  if (p.commands && p.commands.length) {
    sectionsHtml += '<h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#666;margin:18px 0 6px;">Key CLI Commands</h2>';
    p.commands.forEach(function(cmd){sectionsHtml += '<div style="margin-bottom:6px;"><div style="font-size:11px;color:#666;margin-bottom:2px;">' + (cmd.desc||'') + '</div><div style="background:#0A0E1A;color:#A8C7F8;font-family:monospace;font-size:11px;padding:5px 8px;border-radius:4px;">' + (cmd.cmd||'') + '</div></div>';});
  }

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AZ-104 Cheat Sheet - ' + dom.name + '</title>' +
    '<style>body{font-family:system-ui,sans-serif;padding:30px;max-width:900px;margin:0 auto;color:#111;}' +
    '@media print{body{padding:15px;}}' +
    '</style></head><body>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0078D4;padding-bottom:10px;margin-bottom:16px;">' +
    '<div><div style="font-size:18px;font-weight:800;">' + dom.icon + ' AZ-104 Cheat Sheet &mdash; ' + dom.name + '</div>' +
    '<div style="font-size:11px;color:#666;">Based on Microsoft official study guide (April 2026) &middot; Passing score: 700/1000</div></div>' +
    '<div style="font-size:11px;color:#999;">' + new Date().toLocaleDateString() + '</div></div>' +
    sectionsHtml +
    '<div style="margin-top:20px;font-size:10px;color:#999;border-top:1px solid #eee;padding-top:8px;">AZ-104 Practice Tool &middot; Study guide: learn.microsoft.com/credentials/certifications/resources/study-guides/az-104</div>' +
    '</body></html>';

  var win=window.open('','_blank','width=900,height=700');
  if(win){win.document.write(html);win.document.close();win.focus();setTimeout(function(){win.print();},400);}
}
